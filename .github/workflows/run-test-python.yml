name: run-test-python

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - packages/python/**
      - .github/workflows/run-test-python.yml
  workflow_dispatch:

defaults:
  run:
    working-directory: packages/python

jobs:
  run-test-python:
    runs-on: ${{ matrix.os }}
    name: Test Python ${{ matrix.python_version }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The floor `pyproject.toml` declares, whatever is current, and one in
        # between. A library that only ever runs on the newest interpreter is a
        # library whose `requires-python` is a guess.
        python_version: ['3.10', '3.12', '3.14']
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python_version }}
          cache: pip
          cache-dependency-path: packages/python/pyproject.toml
      - name: Install the package and its dev tools
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Verify formatting
        run: ruff format --check .
      - name: Type-check
        run: mypy
      - name: Test package (functions)
        run: pytest

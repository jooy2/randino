name: run-check-data

# The three packages each hold their own copy of the datasets, written in their
# own language's syntax. No package's own suite can see past its own copy: a word
# added to one of them and forgotten in the others breaks no test, because each
# suite asserts over whatever pools its own package happens to hold. This is the
# check that reads all three and compares them.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - packages/**
      - tools/**
      - .github/workflows/run-check-data.yml
  workflow_dispatch:

jobs:
  run-check-data:
    runs-on: ubuntu-latest
    name: Check that the packages hold the same data

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/javascript/package-lock.json
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Each dump loads its package the way that package's own tests do, so every
      # toolchain has to be here.
      - name: Install the JavaScript package
        run: npm ci
        working-directory: packages/javascript
      - name: Install the Dart package
        run: dart pub get
        working-directory: packages/dart
      - name: Install the Python package
        run: pip install -e .
        working-directory: packages/python

      - name: Compare the datasets across the packages
        run: node tools/parity/index.mjs

name: run-check-parity

# The three packages hold the same datasets, each written in its own language's
# syntax. This reads them out of all three and fails if they disagree — the one
# failure mode that none of the per-package suites can see.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - packages/**
      - tools/**
      - .github/workflows/run-check-parity.yml
  workflow_dispatch:

jobs:
  run-check-parity:
    runs-on: ubuntu-latest
    name: Check that the packages hold the same data

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/javascript/package-lock.json
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Each dump loads its package the way that package's own tests do, so each
      # one needs that package resolvable first.
      - name: Install the JavaScript package
        run: npm ci
        working-directory: packages/javascript
      - name: Install the Dart package
        run: dart pub get
        working-directory: packages/dart
      - name: Install the Python package
        run: pip install -e .
        working-directory: packages/python

      - name: Compare the datasets
        run: node tools/parity/index.mjs

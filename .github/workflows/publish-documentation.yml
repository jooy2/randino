name: publish-documentation

on:
  push:
    branches: [main]
    paths:
      - docs/**
      # The demo page bundles the JavaScript package from source rather than
      # from npm, so a change to the library changes what the site serves.
      - packages/javascript/lib/**
      # The site also reads every package's manifest and changelog, so a release
      # on any side changes what it publishes. Nothing else in `packages/` does.
      - packages/javascript/package.json
      - packages/javascript/CHANGELOG.md
      - packages/dart/pubspec.yaml
      - packages/dart/CHANGELOG.md
      - packages/python/pyproject.toml
      - packages/python/CHANGELOG.md
      - .github/workflows/publish-documentation.yml
  # Deploy on demand — for a rollback, or after a DNS change that the site's
  # own content had no reason to trigger.
  workflow_dispatch:

# A second push while a deploy is in flight would race it. Let the newer one
# win, and do not cancel a deploy that has already started.
concurrency:
  group: publish-documentation
  cancel-in-progress: false

# Nothing but the checkout by default. The deploy job asks for what it needs on
# its own, so the job that installs dependencies never holds a credential.
permissions:
  contents: read

jobs:
  # Builds the site and hands it over as an artifact. This is the job that runs
  # `npm ci`, and with it every install script of every dependency, so it holds
  # no token that can write anywhere: a dependency gone bad could change what it
  # builds, and nothing more.
  build:
    runs-on: ubuntu-latest
    name: Build the documentation site
    outputs:
      host: ${{ steps.site.outputs.host }}
    defaults:
      run:
        working-directory: docs

    steps:
      - uses: actions/checkout@v5
        with:
          # Every commit, so VitePress can date each page from its git history.
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci

      # `run-build-docs` covers pull requests; this covers the pushes that land
      # on `main` directly, which are the ones that would otherwise deploy
      # unchecked.
      - name: Type-check the site's own TypeScript
        run: npm run typecheck
      - name: Check formatting
        run: npm run format
      # Fails on a dead page link (VitePress) and on a dead heading anchor
      # (`scripts/check-anchors.mjs`), which is the half VitePress does not check.
      - name: Build
        run: npm run build

      # The site's URL lives in the npm package manifest — `config.ts` reads the
      # same field for canonical links and the sitemap. The deploy job checks the
      # custom domain Pages is set to against it, so the two cannot drift apart.
      - name: Resolve the site hostname
        id: site
        run: |
          echo "host=$(node -p "new URL(require('../packages/javascript/package.json').homepage).hostname")" >> "$GITHUB_OUTPUT"

      - name: Hand the site over
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs-dist

  # Deploys the artifact through GitHub Pages' own deployment, with a token
  # GitHub signs for this job alone. No long-lived token is stored anywhere, and
  # this job runs no code of the repository's dependencies. The Pages source has
  # to be set to "GitHub Actions" in the repository's settings for it to work,
  # and the custom domain is the one set there.
  #
  # Every action here is pinned to a commit rather than a tag, since a tag is a
  # name its owner can move and this is the job that can publish.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    name: Deploy the documentation site
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Read the Pages settings
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Check the custom domain against the manifest
        env:
          CONFIGURED: ${{ steps.pages.outputs.host }}
          EXPECTED: ${{ needs.build.outputs.host }}
        run: |
          if [ "$CONFIGURED" != "$EXPECTED" ]; then
            echo "Pages serves $CONFIGURED, but the manifest's homepage is $EXPECTED." >&2
            exit 1
          fi

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

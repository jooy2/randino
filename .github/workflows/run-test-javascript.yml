name: run-test-javascript

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - packages/javascript/**
      - .github/workflows/run-test-javascript.yml
  workflow_dispatch:

defaults:
  run:
    working-directory: packages/javascript

# Nothing here writes anything back.
permissions:
  contents: read

jobs:
  run-test-javascript:
    runs-on: ${{ matrix.os }}
    name: Test JavaScript ${{ matrix.node_version }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The floor `package.json` declares, whatever is current, and one in
        # between. A library that only ever runs on the newest runtime is a
        # library whose `engines` field is a guess — which is what it was: the
        # floor read 18 and nothing had ever run there.
        node_version: ['22', '24', '25']
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5
        name: Setup Node.js ${{ matrix.node_version }}
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node_version }}
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - run: npm ci
      - name: Test module script (functions)
        run: npm run test

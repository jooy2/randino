name: randino
description: >-
  Generates random names, nicknames, words, sentences, locations, ages,
  genders, organizations, dates, phone numbers and real system specs. Nine
  languages, pure Dart.
version: 1.3.1
repository: https://github.com/jooy2/randino
homepage: https://randino.cdget.com
issue_tracker: https://github.com/jooy2/randino/issues
topics:
  - random
  - name
  - nickname
  - generator
  - mock

environment:
  # Records and sealed classes are the only Dart 3 features in here, and both
  # landed in 3.0. The floor is 3.7 for a duller reason: that is where the
  # formatter this package is written against arrived, and where the
  # `page_width` in `analysis_options.yaml` starts being read. Flutter 3.29
  # ships it.
  sdk: ^3.7.0

dev_dependencies:
  lints: ^5.1.1
  test: ^1.25.15
